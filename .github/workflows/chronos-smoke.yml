name: Chronos smoke test

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run deployed Chronos smoke test
        env:
          MAINTAIN_AI_ML_URL: https://maintain-ai-ml.onrender.com
        run: python scripts/smoke_forecast.py
