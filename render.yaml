services:
  - type: web
    name: maintain-ai-ml
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: MAINTAIN_CHRONOS_MODEL
        value: amazon/chronos-bolt-tiny
      - key: MAINTAIN_ENABLE_TIMER_LITE
        value: "1"
      - key: MAINTAIN_ENABLE_TIMER
        value: "0"
      - key: MAINTAIN_TIMER_MODEL
        value: thuml/timer-base-84m
      - key: MAINTAIN_TIMER_CONTEXT
        value: "256"
      - key: MAINTAIN_TIMER_DTYPE
        value: fp16
